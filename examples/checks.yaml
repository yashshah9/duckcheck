name: sample-suite
source: examples/sample.csv
checks:
  - name: id_not_null
    type: not_null
    table: source_data
    column: id
  - name: name_not_null
    type: not_null
    table: source_data
    column: name
  - name: status_values
    type: accepted_values
    table: source_data
    column: status
    values: [active, inactive]
  - name: at_least_one_row
    type: row_count
    min_rows: 1
  - name: no_negative_amounts
    type: custom_sql
    sql: SELECT * FROM source_data WHERE amount < 0
