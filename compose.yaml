services:
  test:
    build: {context: ., dockerfile: docker/Dockerfile}
    volumes: [".:/app"]
    working_dir: /app
    command: ["pytest", "tests/", "-v"]
  run-example:
    build: {context: ., dockerfile: docker/Dockerfile}
    volumes: [".:/app"]
    working_dir: /app
    command: ["duckcheck", "run", "examples/clean.yaml"]
