[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "duckcheck"
version = "0.3.0"
description = "Lightweight data quality checks powered by DuckDB"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "duckdb>=1.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rich>=13.7",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.9", "types-PyYAML>=6.0"]

[project.scripts]
duckcheck = "duckcheck.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/duckcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["duckcheck"]
